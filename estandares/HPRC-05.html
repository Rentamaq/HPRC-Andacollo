<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HPRC-05 Trabajos eléctricos</title>
<style>
/* Visor tipo Drive: barra oscura arriba, páginas blancas sobre gris */
:root{color-scheme:dark;--bar:#2b2f36;--bar2:#3a3f48;--bg:#4a4f57;--ink:#f1f3f5;--muted:#b9bfc8;--accent:#f2b705;--ok:#5cc58a}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.top{position:sticky;top:0;z-index:5;background:var(--bar);box-shadow:0 2px 8px rgba(0,0,0,.35);
  padding-top:env(safe-area-inset-top,0px);padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.row{display:flex;align-items:center;gap:8px;min-height:56px;flex-wrap:wrap;padding-block:6px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--ink);text-decoration:none;font-weight:700;padding:8px 12px;border-radius:999px;background:var(--bar2)}
.back:hover{background:#4a515c}
.ttl{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.code{background:var(--accent);color:#1f2328;font-weight:800;font-size:.8rem;padding:3px 8px;border-radius:6px;flex:none}
.name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;align-items:center;gap:6px;margin-left:auto}
.tools button{font:inherit;font-weight:700;color:var(--ink);background:var(--bar2);border:0;border-radius:8px;min-width:36px;height:34px;cursor:pointer}
.tools button:hover{background:#4a515c}
.tools output{min-width:52px;text-align:center;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}
#pg{color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip{font-size:.78rem;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--bar2);color:var(--muted);white-space:nowrap}
.chip.ok{color:var(--ok)}
a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#doc{display:flex;flex-direction:column;align-items:safe center;overflow-x:auto;gap:14px;padding:18px max(10px,env(safe-area-inset-right,0px)) 40px max(10px,env(safe-area-inset-left,0px))}
.pg{background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.45);position:relative;max-width:100%}
.pg canvas{display:block;width:100%;height:100%}
.pg .ph{position:absolute;inset:0;display:grid;place-items:center;color:#888;font-size:.9rem}
.msg{max-width:560px;margin:40px auto;padding:20px;background:var(--bar);border-radius:12px;line-height:1.5}
.msg a{color:var(--accent)}
.foot{text-align:center;color:var(--muted);font-size:.8rem;padding:0 16px 30px}
.foot a{color:inherit}
@media (max-width:560px){.name{white-space:normal;font-size:.9rem;line-height:1.2}.chip{display:none}}
</style>
</head>
<body>
<header class="top">
  <div class="row">
    <a class="back" href="../#HPRC-05">← Guía</a>
    <div class="ttl"><span class="code">HPRC-05</span><span class="name">Trabajos eléctricos</span></div>
    <div class="tools">
      <span id="pg">Cargando…</span>
      <button id="zo" type="button" aria-label="Alejar">−</button>
      <output id="zv">100%</output>
      <button id="zi" type="button" aria-label="Acercar">+</button>
      <span class="chip" id="net"></span>
    </div>
  </div>
</header>
<main id="doc" aria-label="Documento HPRC-05"></main>
<p class="foot">Copia del estándar oficial Teck guardada en este sitio para consulta sin conexión. <a href="https://drive.google.com/file/d/1ikz9DeLLbLRF_T1uWP_5KI7V3nCIE4kU/view" target="_blank" rel="noopener">Ver original en Drive</a></p>

<script src="../pdfjs/pdf.min.js"></script>
<script>
const PDF_URL = '../pdf/HPRC-05.pdf';
const doc = document.getElementById('doc'), pgOut = document.getElementById('pg'), zv = document.getElementById('zv'), net = document.getElementById('net');
let pdf = null, zoom = 1, pages = [], io = null;

function netState(){ net.textContent = navigator.onLine ? 'En línea' : 'Sin conexión'; net.classList.toggle('ok', !navigator.onLine); }
addEventListener('online', netState); addEventListener('offline', netState); netState();

if ('serviceWorker' in navigator && /github\.io$/.test(location.hostname)) {
  navigator.serviceWorker.register('../sw.js', {scope:'../'}).catch(()=>{});
}

function baseWidth(){ return Math.min(doc.clientWidth - 20, 900); }

async function render(p){
  if (p.done || p.busy) return; p.busy = true;
  const page = await pdf.getPage(p.n);
  const w = p.el.clientWidth, vp1 = page.getViewport({scale:1});
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  const vp = page.getViewport({scale: (w / vp1.width) * dpr});
  const c = document.createElement('canvas'); c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
  await page.render({canvasContext: c.getContext('2d'), viewport: vp}).promise;
  p.el.innerHTML = ''; p.el.appendChild(c); p.done = true; p.busy = false;
}

function layout(){
  const bw = baseWidth() * zoom;
  pages.forEach(p => { p.el.style.width = bw + 'px'; p.el.style.height = (bw * p.ratio) + 'px'; p.done = false; p.el.innerHTML = `<div class="ph">Página ${p.n}</div>`; });
  if (io) io.disconnect();
  io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) render(pages[+e.target.dataset.i]); }), {rootMargin:'600px 0px'});
  pages.forEach(p => io.observe(p.el));
  zv.textContent = Math.round(zoom * 100) + '%';
}

function track(){
  const mid = innerHeight * 0.35; let cur = 1;
  for (const p of pages) { const r = p.el.getBoundingClientRect(); if (r.top <= mid) cur = p.n; }
  pgOut.textContent = `Página ${cur} de ${pages.length}`;
}

(async () => {
  try {
    pdfjsLib.GlobalWorkerOptions.workerSrc = '../pdfjs/pdf.worker.min.js';
    pdf = await pdfjsLib.getDocument(PDF_URL).promise;
    for (let n = 1; n <= pdf.numPages; n++) {
      const pg = await pdf.getPage(n), v = pg.getViewport({scale:1});
      const el = document.createElement('div'); el.className = 'pg'; el.dataset.i = n - 1;
      el.setAttribute('aria-label', `Página ${n}`);
      doc.appendChild(el); pages.push({n, el, ratio: v.height / v.width, done:false, busy:false});
    }
    layout(); track();
    addEventListener('scroll', track, {passive:true});
    let t; addEventListener('resize', () => { clearTimeout(t); t = setTimeout(layout, 200); });
  } catch (e) {
    doc.innerHTML = `<div class="msg"><b>No se pudo abrir el documento.</b><br>Si estás sin conexión, abre la guía al menos una vez con internet para guardarla en este equipo. También puedes <a href="https://drive.google.com/file/d/1ikz9DeLLbLRF_T1uWP_5KI7V3nCIE4kU/view" target="_blank" rel="noopener">ver el original en Drive</a>.</div>`;
    pgOut.textContent = '';
  }
})();

document.getElementById('zi').onclick = () => { zoom = Math.min(3, +(zoom + .25).toFixed(2)); layout(); };
document.getElementById('zo').onclick = () => { zoom = Math.max(.5, +(zoom - .25).toFixed(2)); layout(); };
</script>
</body>
</html>
